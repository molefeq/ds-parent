
name: Build and Publish ds-parent

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  publish:
    runs-on:
      - codebuild-codebuild-que-ads-maven-runner-${{ github.run_id }}-${{ github.run_attempt }}
        
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Verify Java and Maven
        run: |
          java -version
          mvn -version

      - name: Verify Maven deployment configuration
        run: |
          test -f .circleci/settings.xml
          grep -n -A 15 '<distributionManagement>' pom.xml || true
          mvn -B help:effective-pom \
            -Doutput=effective-pom.xml \
            -s .circleci/settings.xml

      - name: Build, verify and publish
        run: |
          set -euo pipefail
          mvn -B -ntp clean deploy \
            -s .circleci/settings.xml \
            -DskipTests=false \
            -DskipITs=false
