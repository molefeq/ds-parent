
name: Build and Publish ds-parent

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  publish:
    runs-on:
      - codebuild-codebuild-que-ads-maven-runner-${{ github.run_id }}-${{ github.run_attempt }}
        
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Verify Java and Maven
        run: |
          java -version
          mvn -version

      - name: Build and verify
        run: mvn -B clean verify -s .circleci/settings.xml

      - name: Publish Maven artifact
        run: mvn -B deploy -s .circleci/settings.xml
